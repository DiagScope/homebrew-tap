name: update-formula

on:
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update formula
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA256:  ${{ github.event.client_payload.sha256 }}
        run: |
          NEW_URL="https://github.com/DiagScope/releases/releases/download/v${VERSION}/diagscope-${VERSION}.jar"
          sed -i \
            -e "s|url \"[^\"]*\"|url \"${NEW_URL}\"|" \
            -e "s/sha256 \"[^\"]*\"/sha256 \"${SHA256}\"/" \
            -e "s/version \"[^\"]*\"/version \"${VERSION}\"/" \
            Formula/diagscope.rb

      # The README shows the Maven plugin with a concrete version; keep it on the newest.
      - name: Update the README examples
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          perl -0pi -e 's#(<artifactId>diagscope-maven-plugin</artifactId>\s*<version>)[^<]+(</version>)#$1$ENV{VERSION}$2#g; s#(diagscope-maven-plugin:)\d[^:\s]*(:scan)#$1$ENV{VERSION}$2#g' README.md

      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/diagscope.rb README.md
          git commit -m "chore: bump diagscope to ${VERSION}"
          git push
